# pgBackRest стенда (S4-06); секреты (ключи S3, пароль шифрования) приходят переменными окружения.
# На боевом сервере меняются только адрес хранилища и сертификат: repo1-s3-endpoint, repo1-s3-bucket,
# repo1-storage-ca-file (S21-04, S3 российского провайдера).
[global]
repo1-type=s3
repo1-s3-endpoint=seaweedfs
repo1-storage-port=8334
repo1-s3-bucket=pgbackrest
repo1-s3-region=us-east-1
repo1-s3-uri-style=path
# Самоподписанный сертификат SeaweedFS из тома s3ca (создаёт задача s3-certs; в этот том попадает только
# сертификат, закрытый ключ лежит в s3tls и виден одному SeaweedFS).
repo1-storage-ca-file=/etc/seaweedfs-tls/server.crt
repo1-path=/repo
# Шифрование на стороне клиента: ключ хранится отдельно от копий (секрет pgbackrest_cipher_pass).
repo1-cipher-type=aes-256-cbc
# Хранение 14 дней (⚖️ срок копий, 4.16): старые полные копии и WAL стираются командой expire.
repo1-retention-full-type=time
repo1-retention-full=14
process-max=2
start-fast=y
compress-type=zst
compress-level=3
archive-async=y
archive-push-queue-max=1GiB
spool-path=/var/spool/pgbackrest
log-path=/var/log/pgbackrest
log-level-console=info
log-level-file=detail

[messunjerr]
pg1-path=/var/lib/postgresql/18/docker
pg1-socket-path=/var/run/postgresql
pg1-user=postgres
