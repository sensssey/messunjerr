# CI бэкенда v2: линтеры и типы, тесты на настоящих PostgreSQL 18 и Redis, сборка боевого образа.
# Код v0.1 (backend/src вне messunjerr) этим workflow не проверяется: он живёт до S13.
name: backend

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - deploy/**
      - scripts/**
      - docs/backend-v2-spec.md
      - .github/workflows/backend.yml
  pull_request:
    paths:
      - backend/**
      - deploy/**
      - scripts/**
      - docs/backend-v2-spec.md
      - .github/workflows/backend.yml
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.12.23"

jobs:
  static:
    name: Линтеры, типы, границы модулей
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Зависимости
        run: uv sync --frozen --group dev
      - name: Lock-файл актуален
        run: uv lock --check
      - name: ruff (код)
        run: uv run ruff check src tests_v2 migrations
      - name: ruff (форматирование)
        run: uv run ruff format --check src tests_v2 migrations
      - name: pyright (strict)
        run: uv run pyright
      - name: import-linter
        run: uv run lint-imports

  tests:
    name: Тесты (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14", "3.13"]
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      # Сквозной тест письма: API -> arq -> воркер -> SMTP -> Mailpit.
      mailpit:
        image: axllent/mailpit:v1.31.4
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    # Роли и временные базы тесты создают сами (db-init), поэтому нужны только эти адреса.
    env:
      ADMIN_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/postgres
      DATABASE_URL: postgresql+asyncpg://app:app-ci-password@127.0.0.1:5432/messunjerr
      MIGRATOR_DATABASE_URL: postgresql+asyncpg://migrator:migrator-ci-password@127.0.0.1:5432/messunjerr
      DB_READONLY_PASSWORD: readonly-ci-password
      REDIS_URL: redis://127.0.0.1:6379/0
      SMTP_URL: smtp://127.0.0.1:1025
      MAILPIT_API_URL: http://127.0.0.1:8025
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Зависимости
        run: uv sync --frozen --group dev
      # Хранилище файлов для тестов медиа (S5): тот же образ и те же флаги, что в dev-стеке (всё, кроме
      # S3, слушает 127.0.0.1). Без него тесты test_media_s3.py пропускаются.
      - name: SeaweedFS (S3 для тестов медиа)
        working-directory: .
        run: |
          python3 scripts/init_env.py
          docker compose -f deploy/compose.dev.yml up -d --wait seaweedfs
          {
            echo "S3_ENDPOINT_INTERNAL=http://127.0.0.1:8333"
            echo "S3_ACCESS_KEY=$(sed -n 's/^S3_APP_ACCESS_KEY=//p' deploy/.env)"
            echo "S3_SECRET_KEY=$(sed -n 's/^S3_APP_SECRET_KEY=//p' deploy/.env)"
          } >> "$GITHUB_ENV"
      # Включает тесты «миграции с нуля до head» и `alembic check` (tests_v2/integration).
      - name: Тесты
        run: uv run pytest -c pyproject.toml tests_v2 -ra

  image:
    name: Сборка образа
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Боевой образ (prod)
        run: docker build -f backend/Dockerfile.v2 --target prod --build-arg APP_BUILD=${{ github.sha }} -t messunjerr-v2:ci backend
      - name: Образ запускается
        run: docker run --rm messunjerr-v2:ci python -m messunjerr --help
      - name: Образ работает не от root
        run: test "$(docker run --rm messunjerr-v2:ci id -u)" != "0"

  stand-config:
    name: Конфигурация стенда (Compose, Caddy, скрипты)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Секреты (случайные, только для проверки) и env разработки
        run: |
          python3 scripts/init_prod_like.py
          python3 scripts/init_env.py
      - name: Compose стенда и dev-стека разбираются
        run: |
          docker compose -p messunjerr-stand -f deploy/compose.yml config -q
          docker compose -f deploy/compose.dev.yml config -q
      - name: Caddyfile для стенда и для боевого сервера валиден
        run: |
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm -e SITE_ADDRESS=example.ru -e TLS_MODE=tls_auto -e ACME_EMAIL=admin@example.ru \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Caddyfile отформатирован (caddy fmt)
        run: |
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11-alpine \
            caddy fmt /etc/caddy/Caddyfile | diff -u deploy/Caddyfile - \
            || { echo "::error::выполните caddy fmt --overwrite deploy/Caddyfile"; exit 1; }
      - name: Журналы Caddy (доступа, ошибок, служебный) скрывают ticket и подписи
        run: |
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11-alpine \
            caddy adapt --config /etc/caddy/Caddyfile | python3 scripts/check_caddy_logging.py
      - name: Скрипты выкладки, копий и SeaweedFS (shellcheck)
        run: shellcheck -x -S warning deploy/*.sh deploy/backup/*.sh deploy/seaweedfs/*.sh deploy/postgres/*.sh
