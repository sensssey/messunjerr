services:
  db:
    image: postgres:16
    container_name: postgres_container
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # только localhost: БД не должна быть доступна из сети
      - "127.0.0.1:3245:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: fastapi_container
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "1221:8000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "1337:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
    - ./frontend/.env
    # dev-сервер CRA завершается, когда закрывается stdin: без TTY контейнер останавливается сразу после старта
    stdin_open: true
    tty: true
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
